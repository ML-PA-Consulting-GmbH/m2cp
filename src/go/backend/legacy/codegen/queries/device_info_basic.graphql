
query getDeviceInfoBasic($id: UUID!) {
    device(id: $id) {
        id
        serialNumber
        hardwareSerialNumber
        deviceName
        description
        isDeviceActivated
        isUpdateActivated
        deviceStatus {
            lastAppstoreActivity
            lastMessagingActivity
            lastHubEndpoint
            lastUptime
            lastUplinkSignalContent
        }
        deviceModelRevision {
            id
            deviceModel {
                deviceType {
                    deviceTypeName
                }
                modelName
                architecture
            }
            revision
            deviceModelRevisionBridgeApps {
                app {
                    id
                    appName
                    description
                }
            }
        }
        pendingActions {
            pendingActionCount
            items {
                appName
                deltaFileSize
                downloadSize
                installedRevision
                installedVersion
                isCoreApp
                pendingActionName
                targetRevision
                targetVersion
            }
        }
        connectedDevice{
            id
            serialNumber
            hardwareSerialNumber
            deviceName
        }
        connectedDevices{
            id
            serialNumber
            hardwareSerialNumber
            deviceName
            deviceModelRevision {
                deviceModel {
                    modelName
                    architecture
                }
                revision
            }

        }
        deviceSnap {
            deviceTpmEkPublicKey
            uplinkMode
        }
        assetId
        asset {
          id
        }
    }
}
