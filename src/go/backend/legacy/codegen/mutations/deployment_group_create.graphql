mutation CreateDeploymentGroups($input: [DeploymentGroupCreateInput!]!) {
  createDeploymentGroups(deploymentGroups: $input) {
    autoUpdateModeId
    createdAt
    createdBy
    description
    deviceModelRevisionId
    id
    isDeltaUpdateOnly
    modifiedAt
    modifiedBy
    name
    ownerUserId
  }
}