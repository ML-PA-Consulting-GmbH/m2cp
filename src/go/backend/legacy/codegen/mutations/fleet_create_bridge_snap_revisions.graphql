mutation CreateFleetBridgeSnapRevisions($fleetId: UUID!, $snapRevisionId: UUID!)
{
    createFleetBridgeSnapRevisions(fleetBridgeSnapRevisions: [
        {
            fleetId: $fleetId
            snapRevisionId: $snapRevisionId
        }
    ])
    {
        id
        fleetId
        snapRevisionId
    }
}
