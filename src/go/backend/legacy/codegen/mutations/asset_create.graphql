mutation createAsset(
    $model: UUID!,
    $serial: String!,
    $name: String!,
    $description: String,
    $attestationKey: String,
    $tenantId: UUID!
) {
    createAssets(
        assets: {
            assetModelId: $model,
            assetName: $name,
            attestationKey: $attestationKey,
            serialNo: $serial,
            assetDescription: $description,
            tenantId: $tenantId
        }
    ) {
        id
        attestationKey
    }
}