mutation ModifyDevice(
  $deviceId: UUID!,
  $deviceName: String,
  $deviceDescription: String,
  $deviceActivated: Boolean,
  $deviceUpdateActivated: Boolean
) {
  updateDevices(
    devices: [{
      id: $deviceId,
      deviceName: $deviceName,
      description: $deviceDescription,
      isDeviceActivated: $deviceActivated,
      isUpdateActivated: $deviceUpdateActivated
    }]
  ) {
    id
    deviceName
    serialNumber
    description
    isDeviceActivated
    isUpdateActivated
  }
}
