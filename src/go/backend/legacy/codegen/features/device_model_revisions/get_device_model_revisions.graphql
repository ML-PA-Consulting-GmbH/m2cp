query GetDeviceModelRevisionList(
    $filter: DeviceModelRevisionFilterInput
    $take: Int
    $skip: Int
) {
    deviceModelRevisions(where: $filter, take: $take, skip: $skip) {
        items {
            id
            deviceModelId
            deviceModel {
                modelName
                deviceTypeId
                architecture
            }
            revision
            uploadMessage
        }
        pageInfo{
            hasNextPage
        }
    }
}
